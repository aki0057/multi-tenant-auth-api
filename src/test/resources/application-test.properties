# テスト用インメモリDB（PostgreSQL 方言を H2 で模倣）
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# DDL を Hibernate に自動生成させる（init.sql は使わない）
spring.jpa.hibernate.ddl-auto=create-drop

# .env の読み込みをスキップ（テスト環境では不要）
spring.config.import=

# JWT（test で使うsecretはダミーの値）
jwt.secret="/vf+dI29xLUQYL5OM8HpPIqqeYcvw8pQs6pzcwKtlyw="
jwt.expiration=15m
jwt.refresh-expiration=14d

# 全テストは @SpringBootTest の MOCK 環境。SSL を明示的に無効化してコンテキスト起動を保証する。
server.ssl.enabled=false
