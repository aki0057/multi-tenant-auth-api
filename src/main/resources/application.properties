spring.application.name=multi-tenant-auth-api

# .env ファイルをローカル開発時に自動読み込み
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view= false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# Swagger UI が XSRF-TOKEN クッキーの値を X-XSRF-TOKEN ヘッダで自動送信するようにする（/refresh の CSRF 対応）
springdoc.swagger-ui.csrf.enabled=true

# HTTPS 設定。
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=localhost
server.port=8443
